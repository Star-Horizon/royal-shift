<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ROYAL SHIFT</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 12px 0 6px;
    }

    .sub-title {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    .status-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .status-icon.success {
      background: #e9f8ee;
    }

    .status-icon.pending {
      background: #fff4d8;
    }

    .status-icon.error {
      background: #ffe8e8;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 22px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .description {
      margin: 0 0 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .user-name {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .cast-id {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .badge {
      display: table;
      margin: 0 auto;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: #222;
      color: #fff;
    }

    .form-group {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .primary-button {
      margin-top: 18px;
      background: #222;
      color: #fff;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #666;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border: 4px solid #ddd;
      border-top-color: #222;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-message {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #fff0f0;
      color: #c62828;
      font-size: 13px;
      line-height: 1.6;
    }

    .line-name {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 12px;
      color: #999;
    }

    .hidden {
      display: none;
    }


    /* =====================================================
     * 管理者画面
     * ===================================================== */

    .admin-card {
      margin-top: 16px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .admin-header h2 {
      margin: 0;
    }

    .request-count {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .request-item {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .request-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .request-cast-id {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }

    .request-info {
      font-size: 13px;
      line-height: 1.8;
      color: #666;
    }

    .request-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .approve-button {
      background: #222;
      color: #fff;
    }

    .reject-button {
      background: #eee;
      color: #444;
    }

    .empty-requests {
      text-align: center;
      color: #999;
      font-size: 14px;
      padding: 24px 10px 10px;
    }

    .admin-error {
      padding: 12px;
      background: #fff0f0;
      color: #c62828;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="logo">
      ROYAL SHIFT
    </div>

    <div class="sub-title">
      ROYAL STAFF SYSTEM
    </div>


    <div
      id="app"
      class="card"
    >
      <div class="loading">
        <div class="spinner"></div>
        LINE認証中...
      </div>
    </div>


    <div
      id="adminArea"
      class="hidden"
    ></div>

  </div>


  <script>

    /* =====================================================
     * 01. 設定
     * ===================================================== */

    const LIFF_ID =
      "2011488723-gI54Hlt3";


    const GAS_API_URL =
      "https://script.google.com/macros/s/AKfycbwSZZNbraag8jTLbZbqoXbq9UDQfCeIwA404xkEcVP9l5UZ-7-cCdQCNVXKVq7wqo8pNg/exec";


    let currentIdToken = "";
    let currentLineDisplayName = "";


    /* =====================================================
     * 02. 起動
     * ===================================================== */

    window.addEventListener(
      "load",
      initializeApp
    );


    async function initializeApp() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liff.login();
          return;

        }


        currentIdToken =
          liff.getIDToken();


        if (!currentIdToken) {

          throw new Error(
            "LINE認証情報を取得できませんでした"
          );

        }


        await checkAuthStatus();


      } catch (error) {

        showError(
          error.message ||
          String(error)
        );

      }

    }


    /* =====================================================
     * 03. 認証状態確認
     * ===================================================== */

    async function checkAuthStatus() {

      showLoading(
        "登録情報を確認しています..."
      );


      const result =
        await callApi({

          action: "authStatus",

          idToken:
            currentIdToken

        });


      if (!result.success) {

        throw new Error(
          result.error ||
          "認証状態を確認できませんでした"
        );

      }

if (result.registered) {

  showRegistered(
    result.cast
  );


  /*
   * シフト側でも本人認証できるか確認
   */
  await checkShiftAuth();


  if (
    result.cast &&
    result.cast.isAdmin
  ) {

    await loadAdminRequests();

  }


  return;

}


      currentLineDisplayName =
        result.lineDisplayName || "";


      if (result.pending) {

        showPending(
          result.pendingRequest
        );

        return;

      }


      showRegistrationForm();

    }


    /* =====================================================
     * 04. 登録申請
     * ===================================================== */

    async function submitRegistration() {

      const input =
        document.getElementById(
          "castName"
        );


      const button =
        document.getElementById(
          "submitButton"
        );


      const errorArea =
        document.getElementById(
          "formError"
        );


      const castName =
        String(
          input.value || ""
        ).trim();


      errorArea.innerHTML = "";
      errorArea.classList.add("hidden");


      if (!castName) {

        errorArea.textContent =
          "お名前を入力してください";

        errorArea.classList.remove(
          "hidden"
        );

        return;

      }


      button.disabled = true;
      button.textContent = "申請中...";


      try {

        const result =
          await callApi({

            action:
              "submitRegistrationRequest",

            idToken:
              currentIdToken,

            castName:
              castName

          });


        if (!result.success) {

          throw new Error(
            result.error ||
            "登録申請に失敗しました"
          );

        }


        if (
          result.alreadyRegistered
        ) {

          await checkAuthStatus();
          return;

        }


        showPending({

          castName:
            result.castName ||
            castName,

          status:
            "承認待ち"

        });


      } catch (error) {

        button.disabled = false;
        button.textContent =
          "登録申請する";

        errorArea.textContent =
          error.message ||
          String(error);

        errorArea.classList.remove(
          "hidden"
        );

      }

    }


    /* =====================================================
     * 05. 管理者：申請一覧取得
     * ===================================================== */

    async function loadAdminRequests() {

      const adminArea =
        document.getElementById(
          "adminArea"
        );


      adminArea.classList.remove(
        "hidden"
      );


      adminArea.innerHTML = `
        <div class="card admin-card">
          <div class="loading">
            <div class="spinner"></div>
            登録申請を確認しています...
          </div>
        </div>
      `;


      try {

        const result =
          await callApi({

            action:
              "getRegistrationRequests",

            idToken:
              currentIdToken

          });


        if (!result.success) {

          throw new Error(
            result.error ||
            "登録申請を取得できませんでした"
          );

        }


        renderAdminRequests(
          result.requests || []
        );


      } catch (error) {

        adminArea.innerHTML = `
          <div class="card admin-card">
            <div class="admin-error">
              ${escapeHtml(
                error.message ||
                String(error)
              )}
            </div>
          </div>
        `;

      }

    }


    /* =====================================================
     * 06. 管理者：一覧表示
     * ===================================================== */

    function renderAdminRequests(
      requests
    ) {

      const adminArea =
        document.getElementById(
          "adminArea"
        );


      let content = "";


      if (
        requests.length === 0
      ) {

        content = `
          <div class="empty-requests">
            現在、承認待ちの申請はありません
          </div>
        `;

      } else {

        requests.forEach(
          (request) => {

            content += `

              <div class="request-item">

                <div class="request-name">
                  ${escapeHtml(
                    request.castName || ""
                  )}
                </div>

                <div class="request-cast-id">
                  CAST ID :
                  ${escapeHtml(
                    request.castId || ""
                  )}
                </div>

                <div class="request-info">

                  LINE：
                  ${escapeHtml(
                    request.lineDisplayName || ""
                  )}

                  <br>

                  申請日時：
                  ${escapeHtml(
                    request.requestedAt || ""
                  )}

                </div>


                <div class="request-buttons">

                  <button
                    class="approve-button"
                    onclick="approveRequest(
                      '${escapeJs(
                        request.requestId
                      )}'
                    )"
                  >
                    承認
                  </button>


                  <button
                    class="reject-button"
                    onclick="rejectRequest(
                      '${escapeJs(
                        request.requestId
                      )}'
                    )"
                  >
                    却下
                  </button>

                </div>

              </div>

            `;

          }
        );

      }


      adminArea.innerHTML = `

        <div class="card admin-card">

          <div class="admin-header">

            <h2>
              登録申請
            </h2>

            <div class="request-count">
              ${requests.length}
            </div>

          </div>

          ${content}

        </div>

      `;

    }


    /* =====================================================
     * 07. 管理者：承認
     * ===================================================== */

    async function approveRequest(
      requestId
    ) {

      const confirmed =
        window.confirm(
          "この登録申請を承認しますか？"
        );


      if (!confirmed) {
        return;
      }


      showAdminProcessing(
        "承認しています..."
      );


      try {

        const result =
          await callApi({

            action:
              "approveRegistrationRequest",

            idToken:
              currentIdToken,

            requestId:
              requestId

          });


        if (!result.success) {

          throw new Error(
            result.error ||
            "承認に失敗しました"
          );

        }


        window.alert(
          "登録を承認しました"
        );


        await loadAdminRequests();


      } catch (error) {

        window.alert(
          error.message ||
          String(error)
        );


        await loadAdminRequests();

      }

    }


    /* =====================================================
     * 08. 管理者：却下
     * ===================================================== */

    async function rejectRequest(
      requestId
    ) {

      const confirmed =
        window.confirm(
          "この登録申請を却下しますか？"
        );


      if (!confirmed) {
        return;
      }


      showAdminProcessing(
        "却下しています..."
      );


      try {

        const result =
          await callApi({

            action:
              "rejectRegistrationRequest",

            idToken:
              currentIdToken,

            requestId:
              requestId,

            note:
              ""

          });


        if (!result.success) {

          throw new Error(
            result.error ||
            "却下に失敗しました"
          );

        }


        window.alert(
          "登録申請を却下しました"
        );


        await loadAdminRequests();


      } catch (error) {

        window.alert(
          error.message ||
          String(error)
        );


        await loadAdminRequests();

      }

    }


    function showAdminProcessing(
      message
    ) {

      const adminArea =
        document.getElementById(
          "adminArea"
        );


      adminArea.innerHTML = `

        <div class="card admin-card">

          <div class="loading">

            <div class="spinner"></div>

            ${escapeHtml(
              message
            )}

          </div>

        </div>

      `;

    }

    /* =====================================================
 * 08-2. シフト本人認証テスト
 * ===================================================== */

async function checkShiftAuth() {

  const result =
    await callApi({

      action:
        "shiftAuthTest",

      idToken:
        currentIdToken

    });


  if (!result.success) {

    throw new Error(
      result.error ||
      "シフト本人認証に失敗しました"
    );

  }


  const user =
    result.user || {};


  const app =
    document.getElementById(
      "app"
    );


  app.insertAdjacentHTML(
    "beforeend",
    `

      <div
        style="
          margin-top:20px;
          padding-top:18px;
          border-top:1px solid #eee;
          text-align:center;
        "
      >

        <div
          style="
            font-size:12px;
            color:#999;
            margin-bottom:8px;
          "
        >
          SHIFT AUTH TEST
        </div>


        <div
          style="
            font-size:14px;
            font-weight:700;
          "
        >
          ✓ シフト本人認証成功
        </div>


        <div
          style="
            margin-top:8px;
            font-size:13px;
            line-height:1.8;
            color:#666;
          "
        >

          CAST ID：
          ${escapeHtml(
            user.castId || ""
          )}

          <br>

          キャスト名：
          ${escapeHtml(
            user.castName || ""
          )}

          <br>

          権限：
          ${
            user.isAdmin
              ? "管理者"
              : "一般"
          }

        </div>

      </div>

    `
  );

}

    /* =====================================================
     * 09. API通信
     * ===================================================== */

    async function callApi(
      data
    ) {

      const params =
        new URLSearchParams();


      Object.keys(data).forEach(
        (key) => {

          params.append(
            key,
            data[key] == null
              ? ""
              : String(data[key])
          );

        }
      );


      const response =
        await fetch(
          GAS_API_URL,
          {
            method: "POST",
            body: params
          }
        );


      const text =
        await response.text();


      try {

        return JSON.parse(text);

      } catch (error) {

        throw new Error(
          "サーバーから正しい応答を取得できませんでした"
        );

      }

    }


    /* =====================================================
     * 10. 登録済み画面
     * ===================================================== */

    function showRegistered(
      cast
    ) {

      const adminBadge =
        cast.isAdmin

          ? `
            <div class="badge">
              管理者
            </div>
          `

          : `
            <div class="badge">
              登録済み
            </div>
          `;


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon success">
          ✓
        </div>

        <h1>
          LINE認証成功
        </h1>

        <div class="description">
          ROYAL SHIFTにログインしました
        </div>

        <div class="user-name">
          ${escapeHtml(
            cast.castName || ""
          )}
        </div>

        <div class="cast-id">
          CAST ID :
          ${escapeHtml(
            cast.castId || ""
          )}
        </div>

        ${adminBadge}

      `;

    }


    /* =====================================================
     * 11. 未登録画面
     * ===================================================== */

    function showRegistrationForm() {

      document.getElementById(
        "adminArea"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon success">
          ✓
        </div>

        <h1>
          LINE認証成功
        </h1>

        <div class="description">
          初回登録を行います。<br>
          CASTに登録されている名前を入力してください。
        </div>


        <div class="form-group">

          <label for="castName">
            キャスト名
          </label>

          <input
            id="castName"
            type="text"
            placeholder="例：えま"
            autocomplete="off"
          >

        </div>


        <button
          id="submitButton"
          class="primary-button"
          type="button"
          onclick="submitRegistration()"
        >
          登録申請する
        </button>


        <div
          id="formError"
          class="error-message hidden"
        ></div>


        ${
          currentLineDisplayName

            ? `
              <div class="line-name">
                LINE：
                ${escapeHtml(
                  currentLineDisplayName
                )}
              </div>
            `

            : ""
        }

      `;

    }


    /* =====================================================
     * 12. 承認待ち
     * ===================================================== */

    function showPending(
      request
    ) {

      document.getElementById(
        "adminArea"
      ).classList.add(
        "hidden"
      );


      const castName =
        request &&
        request.castName

          ? request.castName

          : "";


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon pending">
          ⏳
        </div>

        <h1>
          登録申請済み
        </h1>

        <div class="description">
          登録申請を受け付けました。<br>
          管理者の承認をお待ちください。
        </div>


        ${
          castName

            ? `
              <div class="user-name">
                ${escapeHtml(
                  castName
                )}
              </div>
            `

            : ""
        }


        <div class="badge">
          承認待ち
        </div>

      `;

    }


    /* =====================================================
     * 13. ローディング / エラー
     * ===================================================== */

    function showLoading(
      message
    ) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="loading">

          <div class="spinner"></div>

          ${escapeHtml(
            message ||
            "読み込み中..."
          )}

        </div>

      `;

    }


    function showError(
      message
    ) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon error">
          !
        </div>

        <h1>
          エラー
        </h1>

        <div class="description">
          ROYAL SHIFTを開けませんでした
        </div>

        <div class="error-message">
          ${escapeHtml(
            message ||
            "不明なエラーが発生しました"
          )}
        </div>

      `;

    }


    /* =====================================================
     * 14. エスケープ
     * ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, "")
        .replace(/\n/g, "");

    }

  </script>

</body>
</html>
