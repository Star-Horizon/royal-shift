    .modal-overlay{position:fixed;inset:0;z-index:500;background:#0007;display:flex;align-items:flex-end;justify-content:center}.modal-card{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:12px 18px calc(22px + var(--safe-bottom))}.modal-handle{width:42px;height:5px;border-radius:99px;background:#ddd;margin:0 auto 15px}.modal-header{display:flex;justify-content:space-between}.modal-header h2{margin:4px 0;font-size:22px}.modal-header p{margin:0;color:#888;font-size:11px}.modal-close{width:38px;height:38px;border:0;border-radius:50%;background:#eee;font-size:24px}.form-section{margin-top:18px}.status-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status-button,.bulk-status-button,.weekday-button{min-height:44px;border:1px solid #ddd;border-radius:11px;background:#f4f4f4;color:#666;font-weight:800}.status-button.selected,.bulk-status-button.selected,.weekday-button.selected{background:#222;color:#fff;border-color:#222}.time-grid{display:grid;grid-template-columns:1fr 20px 1fr;align-items:end;gap:4px}.time-separator{text-align:center;padding-bottom:15px}.manual-time-field{display:flex;align-items:center;background:#f5f5f5;border:1px solid #ddd;border-radius:12px;overflow:hidden}.manual-time-part{width:100%;min-width:0;height:48px;border:0;background:transparent;text-align:center;font-size:18px;font-weight:800}.manual-time-colon{font-weight:800}.manual-time-field.last-selected{background:#242424}.manual-time-field.last-selected input,.manual-time-field.last-selected span{color:#fff;opacity:.4}.last-time-button{width:100%;min-height:42px;margin-top:10px;border:1px solid #ddd;border-radius:11px;background:#f2f2f2;font-size:11px;font-weight:800}.last-time-button.selected{background:#222;color:#fff}.textarea{min-height:78px;padding:12px;resize:none}.modal-save-button,.clear-button{width:100%;min-height:50px;border-radius:13px;font-weight:800}.modal-save-button{margin-top:18px;background:#222;colo <body>
<div id="loadingScreen" class="loading-screen"><div class="loading-logo">R</div><div class="loading-text">ROYAL SHIFT</div></div>

<div id="authView" class="auth-wrap">
  <div class="auth-logo">ROYAL SHIFT</div><div class="auth-sub">ROYAL STAFF SYSTEM</div>
  <div id="authApp" class="auth-card"><div class="loading"><div class="spinner"></div>LINE認証中...</div></div>
  <div id="adminArea" class="hidden"></div>
</div>

<div id="shiftView" class="hidden">
<header class="app-header"><div><div class="header-logo">ROYAL</div><div class="header-subtitle">SHIFT SUBMISSION</div></div><button class="header-diamond-button" onclick="showNotice('通知機能は準備中です')"><span class="header-diamond"></span></button></header>
<main class="main-content"><section>
  <div class="shift-top"><div><span class="page-label">SHIFT SUBMISSION</span><h1>シフト提出</h1></div><div id="monthStatus" class="month-status">未提出</div></div>
  <div class="progress-card"><div class="progress-header"><div><span>入力状況</span><strong id="progressPercent">0%</strong></div><p id="progressMessage">日付を選択して入力してください</p></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div>
  <div class="calendar-card"><div id="calendar"></div></div>
  <div class="legend"><div><span class="legend-dot working"></span>出勤</div><div><span class="legend-dot holiday"></span>休み</div><div><span class="legend-dot undecided"></span>未定</div><div><span class="legend-dot empty"></span>未入力</div></div>
  <button class="bulk-button" onclick="openBulkModal()">一括入力</button>
  <button id="submitMonthButton" class="submit-button" onclick="submitMonth()">この内容で提出する</button>
</section></main>
</div>

<div id="multiSelectBar" class="multi-select-bar hidden"><div class="multi-select-info"><span>複数日選択中</span><strong id="multiSelectCount">0日選択</strong></div><div class="multi-select-actions"><button class="multi-select-cancel" onclick="cancelMultiSelect()">キャンセル</button><button id="multiSelectNextButton" class="multi-select-next" onclick="openSelectedDatesInput()" disabled>まとめて入力</button></div></div>

<div id="shiftModal" class="modal-overlay hidden" onclick="if(event.target===this)closeShiftModal()"><div class="modal-card"><div class="modal-handle"></div>
<div class="modal-header"><div><span class="modal-label">SHIFT SETTINGS</span><h2 id="modalDateTitle"></h2><p id="modalWeekday"></p></div><button class="modal-close" onclick="closeShiftModal()">×</button></div>
<div class="form-section"><label class="form-label">勤務区分</label><div class="status-selector"><button id="statusWorking" class="status-button selected" onclick="selectStatus('working')">出勤</button><button id="statusHoliday" class="status-button" onclick="selectStatus('holiday')">休み</button><button id="statusUndecided" class="status-button" onclick="selectStatus('undecided')">未定</button></div></div>
<div id="workingFields"><div class="time-grid"><div class="form-section"><label class="form-label">出勤時間</label><div class="manual-time-field"><input id="startHour" class="manual-time-part" inputmode="numeric" maxlength="2"><span class="manual-time-colon">:</span><input id="startMinute" class="manual-time-part" inputmode="numeric" maxlength="2"><input id="startTime" type="hidden"></div></div><div class="time-separator">〜</div><div class="form-section"><label class="form-label">退勤時間</label><div id="endTimeField" class="manual-time-field"><input id="endHour" class="manual-time-part" inputmode="numeric" maxlength="2"><span class="manual-time-colon">:</span><input id="endMinute" class="manual-time-part" inputmode="numeric" maxlength="2"><input id="endTime" type="hidden"></div></div></div><button id="endTimeLastButton" class="last-time-button" onclick="toggleEndTimeLast()">退勤時間をLASTにする</button></div>
<div class="form-section"><label class="form-label">備考</label><textarea id="shiftNote" class="form-control textarea" maxlength="100"></textarea></div>
<button id="saveSelectedDateButton" class="modal-save-button" onclick="saveSelectedDate()">この日の内容を保存</button><button id="clearDateButton" class="clear-button hidden" onclick="clearSelectedDate()">入力を削除</button>
</div></div>

<div id="bulkModal" class="modal-overlay hidden" onclick="if(event.target===this)closeBulkModal()"><div class="modal-card"><div class="modal-handle"></div>
<div class="modal-header"><div><span class="modal-label">BULK SHIFT SETTINGS</span><h2>一括入力</h2><p id="bulkTargetMonthText"></p></div><button class="modal-close" onclick="closeBulkModal()">×</button></div>
<div class="form-section"><label class="form-label">入力方法</label><div class="bulk-mode-selector"><button id="bulkModeSelectedDates" class="bulk-mode-button selected" onclick="selectBulkMode('selectedDates')"><span class="bulk-mode-text"><strong>選択した日</strong><small>カレンダーから自由に選択</small></span></button><button id="bulkModeWeekdays" class="bulk-mode-button" onclick="selectBulkMode('weekdays')"><span class="bulk-mode-text"><strong>曜日でまとめて</strong><small>毎週同じ曜日に入力</small></span></button></div></div>
<div id="selectedDatesModePanel"><div class="selected-dates-guide"><div><strong>カレンダーから日付を選択</strong><p>入力したい日をすべてタップしてください</p></div></div><button class="calendar-select-button" onclick="startMultiSelect()">日付の選択を開始</button><div id="selectedDatesSummary" class="hidden"><strong id="selectedDatesSummaryCount">0日</strong></div></div>
<div id="weekdaysModePanel" class="hidden"><div class="form-section"><label class="form-label">入力する曜日</label><div class="weekday-selector"><button id="bulkWeekday0" class="weekday-button" onclick="toggleBulkWeekday(0)">日</button><button id="bulkWeekday1" class="weekday-button" onclick="toggleBulkWeekday(1)">月</button><button id="bulkWeekday2" class="weekday-button" onclick="toggleBulkWeekday(2)">火</button><button id="bulkWeekday3" class="weekday-button" onclick="toggleBulkWeekday(3)">水</button><button id="bulkWeekday4" class="weekday-button" onclick="toggleBulkWeekday(4)">木</button><button id="bulkWeekday5" class="weekday-button" onclick="toggleBulkWeekday(5)">金</button><button id="bulkWeekday6" class="weekday-button" onclick="toggleBulkWeekday(6)">土</button></div></div></div>
<div id="bulkInputFields">
<div class="form-section"><label class="form-label">勤務区分</label><div class="status-selector"><button id="bulkStatusWorking" class="bulk-status-button selected" onclick="selectBulkStatus('working')">出勤</button><button id="bulkStatusHoliday" class="bulk-status-button" onclick="selectBulkStatus('holiday')">休み</button><button id="bulkStatusUndecided" class="bulk-status-button" onclick="selectBulkStatus('undecided')">未定</button></div></div>
<div id="bulkWorkingFields"><div class="time-grid"><div class="form-section"><label class="form-label">出勤時間</label><div class="manual-time-field"><input id="bulkStartHour" class="manual-time-part" inputmode="numeric" maxlength="2"><span class="manual-time-colon">:</span><input id="bulkStartMinute" class="manual-time-part" inputmode="numeric" maxlength="2"><input id="bulkStartTime" type="hidden"></div></div><div class="time-separator">〜</div><div class="form-section"><label class="form-label">退勤時間</label><div id="bulkEndTimeField" class="manual-time-field"><input id="bulkEndHour" class="manual-time-part" inputmode="numeric" maxlength="2"><span class="manual-time-colon">:</span><input id="bulkEndMinute" class="manual-time-part" inputmode="numeric" maxlength="2"><input id="bulkEndTime" type="hidden"></div></div></div><button id="bulkEndTimeLastButton" class="last-time-button" onclick="toggleBulkEndTimeLast()">退勤時間をLASTにする</button></div>
<div class="form-section"><label class="form-label">備考</label><textarea id="bulkNote" class="form-control textarea" maxlength="100"></textarea></div>
<label class="overwrite-box"><input id="bulkOverwrite" type="checkbox"><span class="overwrite-text"><strong>入力済みの日も上書きする</strong><small>OFFの場合、すでに入力済みの日はスキップします</small></span></label>
<div class="bulk-preview"><span>登録対象</span><strong id="bulkPreviewCount">0日</strong></div><button id="bulkSaveButton" class="modal-save-button" onclick="saveBulkShifts()">まとめて保存</button>
</div></div></div>

<div id="toast" class="toast"></div>

<script>
const LIFF_ID="2011488723-gI54Hlt3";
const GAS_API_URL="https://script.google.com/macros/s/AKfycbwSZZNbraag8jTLbZbqoXbq9UDQfCeIwA404xkEcVP9l5UZ-7-cCdQCNVXKVq7wqo8pNg/exec";
let currentIdToken="",currentLineDisplayName="",currentCast=null;
let calendar=null,selectedDate="",selectedStatus="working",isSaving=false,isEndTimeLast=false,isLoadingMonth=false,currentMonthSubmitted=false;
let currentCastDefaults={defaultStartTime:"20:00",defaultEndTime:"01:00"};
const shiftEntries={};
let bulkMode="selectedDates",bulkStatus="working",bulkWeekdays=[],multiSelectedDates=[],isMultiSelectMode=false,isBulkSaving=false,isBulkEndTimeLast=false,toastTimer=null;

window.addEventListener("load",initializeApp);
async function initializeApp(){
 try{
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){liff.login();return}
  currentIdToken=liff.getIDToken();
  if(!currentIdToken)throw new Error("LINE認証情報を取得できませんでした");
  await checkAuthStatus();
 }catch(e){hideLoading();showError(e.message||String(e))}
}
async function callApi(data){
 const params=new URLSearchParams();
 Object.keys(data).forEach(k=>params.append(k,data[k]==null?"":String(data[k])));
 const response=await fetch(GAS_API_URL,{method:"POST",body:params});
 const text=await response.text();
 try{return JSON.parse(text)}catch(e){throw new Error("サーバーから正しい応答を取得できませんでした")}
}
async function checkAuthStatus(){
 showAuthLoading("登録情報を確認しています...");
 const r=await callApi({action:"authStatus",idToken:currentIdToken});
 if(!r.success)throw new Error(r.error||"認証状態を確認できませんでした");
 if(r.registered){currentCast=r.cast||{};await startRegisteredApp();return}
 currentLineDisplayName=r.lineDisplayName||"";
 if(r.pending){showPending(r.pendingRequest);hideLoading();return}
 showRegistrationForm();hideLoading();
}
async function startRegisteredApp(){
 const auth=await callApi({action:"shiftAuthTest",idToken:currentIdToken});
 if(!auth.success)throw new Error(auth.error||"シフト本人認証に失敗しました");
 document.getElementById("authView").classList.add("hidden");
 document.getElementById("shiftView").classList.remove("hidden");
 try{
  const d=await callApi({action:"getCurrentCastDefaultTimes",idToken:currentIdToken});
  if(d&&d.success!==false){
   currentCastDefaults.defaultStartTime=normalizeTime(d.defaultStartTime,"20:00");
   currentCastDefaults.defaultEndTime=normalizeTime(d.defaultEndTime,"01:00");
  }
 }catch(e){console.warn(e)}
 initializeManualInputs();
 initializeCalendar();
 if(currentCast&&currentCast.isAdmin)loadAdminRequests(); // admin UI remains available in auth area for later admin screen work
 setTimeout(hideLoading,350);
}
function initializeCalendar(){
 const next=new Date();next.setMonth(next.getMonth()+1);next.setDate(1);
 calendar=new FullCalendar.Calendar(document.getElementById("calendar"),{
  initialView:"dayGridMonth",initialDate:next,locale:"ja",firstDay:0,fixedWeekCount:false,showNonCurrentDates:true,height:"auto",
  headerToolbar:{left:"prev",center:"title",right:"next"},titleFormat:{year:"numeric",month:"long"},dayHeaderFormat:{weekday:"short"},
  dateClick:i=>{if(!isCurrentMonth(i.date))return;if(isMultiSelectMode)toggleMultiSelectedDate(i.dateStr);else openShiftModal(i.dateStr)},
  eventClick:i=>{i.jsEvent.preventDefault();i.jsEvent.stopPropagation();const d=i.event.startStr.slice(0,10);if(isMultiSelectMode)toggleMultiSelectedDate(d);else openShiftModal(d)},
  datesSet:()=>{if(isMultiSelectMode)cancelMultiSelect();updateBulkTargetMonthText();setTimeout(loadDisplayedMonth,0)},
  dayCellDidMount:i=>applyMultiSelectClass(i.el,formatDateObject(i.date)),eventDisplay:"block",displayEventTime:false
 });
 calendar.render();
}
function isCurrentMonth(d){const c=calendar.getDate();return d.getFullYear()===c.getFullYear()&&d.getMonth()===c.getMonth()}
async function loadDisplayedMonth(){
 if(!calendar||isLoadingMonth)return;isLoadingMonth=true;
 const c=calendar.getDate(),year=c.getFullYear(),month=c.getMonth()+1;
 try{
  const r=await callApi({action:"getMonthlyShiftData",idToken:currentIdToken,year,month});
  if(!r.success)throw new Error(r.error||"シフトの読み込みに失敗しました");
  Object.keys(shiftEntries).forEach(k=>{const d=parseLocalDate(k);if(d.getFullYear()===year&&d.getMonth()===month-1)delete shiftEntries[k]});
  (r.entries||[]).forEach(e=>shiftEntries[e.date]={...e,status:e.status||"undecided",startTime:e.startTime||"",endTime:e.endTime||"",note:e.note||""});
  currentMonthSubmitted=!!r.submitted;refreshCalendarEvents();updateProgress();updateBulkPreview();
 }catch(e){showNotice(e.message||String(e))}finally{isLoadingMonth=false}
}
function refreshCalendarEvents(){
 if(!calendar)return;calendar.removeAllEvents();
 Object.values(shiftEntries).forEach(e=>{
  let title=e.status==="working"?"出勤":e.status==="holiday"?"休み":"未定";
  if(e.status==="working"&&e.startTime)title+=" "+e.startTime+(e.endTime?"〜"+e.endTime:"");
  calendar.addEvent({id:e.shiftId||e.date,start:e.date,allDay:true,title,classNames:["shift-"+e.status],backgroundColor:e.status==="holiday"?"#a95b5b":e.status==="undecided"?"#999":"#333"});
 });
}
function updateProgress(){
 const c=calendar.getDate(),days=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();
 let n=0;Object.keys(shiftEntries).forEach(k=>{const d=parseLocalDate(k);if(d.getFullYear()===c.getFullYear()&&d.getMonth()===c.getMonth())n++});
 const p=Math.round(n/days*100);document.getElementById("progressPercent").textContent=p+"%";document.getElementById("progressBar").style.width=p+"%";
 document.getElementById("progressMessage").textContent=n+" / "+days+"日 入力済み";
 const ms=document.getElementById("monthStatus");ms.textContent=currentMonthSubmitted?"提出済み":"未提出";ms.classList.toggle("submitted",currentMonthSubmitted);
 document.getElementById("submitMonthButton").textContent=currentMonthSubmitted?"提出済み":"この内容で提出する";
}
function openShiftModal(date){
 selectedDate=date;const d=parseLocalDate(date);document.getElementById("modalDateTitle").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日";document.getElementById("modalWeekday").textContent=["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"][d.getDay()];
 const e=shiftEntries[date];selectedStatus=e?e.status:"working";selectStatus(selectedStatus);
 setTime("start",e&&e.startTime?e.startTime:currentCastDefaults.defaultStartTime);
 const last=!!(e&&e.endTime==="LAST");setTime("end",last?currentCastDefaults.defaultEndTime:(e&&e.endTime?e.endTime:currentCastDefaults.defaultEndTime));setEndTimeLastState(last);
 document.getElementById("shiftNote").value=e?e.note||"":"";
 document.getElementById("clearDateButton").classList.toggle("hidden",!e);
 document.getElementById("shiftModal").classList.remove("hidden");document.body.classList.add("modal-open")
}
function closeShiftModal(){if(isSaving)return;document.getElementById("shiftModal").classList.add("hidden");document.body.classList.remove("modal-open")}
function selectStatus(s){selectedStatus=s;["working","holiday","undecided"].forEach(x=>document.getElementById("status"+cap(x)).classList.toggle("selected",x===s));document.getElementById("workingFields").classList.toggle("hidden",s!=="working")}
async function saveSelectedDate(){
 if(isSaving)return;let startTime="",endTime="";
 if(selectedStatus==="working"){startTime=getTime("start");endTime=isEndTimeLast?"LAST":getTime("end");if(!startTime||!endTime){showNotice("出勤時間と退勤時間を入力してください");return}}
 isSaving=true;const b=document.getElementById("saveSelectedDateButton");b.disabled=true;b.textContent="保存中...";
 try{
  const r=await callApi({action:"saveShiftEntry",idToken:currentIdToken,date:selectedDate,status:selectedStatus,startTime,endTime,transport:false,note:document.getElementById("shiftNote").value});
  if(!r.success)throw new Error(r.error||"保存に失敗しました");closeShiftModalForce();showNotice("保存しました");await loadDisplayedMonth()
 }catch(e){showNotice(e.message||String(e))}finally{isSaving=false;b.disabled=false;b.textContent="この日の内容を保存"}
}
async function clearSelectedDate(){
 if(!confirm("この日の入力を削除しますか？"))return;
 try{const r=await callApi({action:"deleteShiftEntry",idToken:currentIdToken,date:selectedDate});if(!r.success)throw new Error(r.error||"削除に失敗しました");closeShiftModalForce();showNotice("削除しました");await loadDisplayedMonth()}catch(e){showNotice(e.message||String(e))}
}
function closeShiftModalForce(){document.getElementById("shiftModal").classList.add("hidden");document.body.classList.remove("modal-open")}
async function submitMonth(){
 const c=calendar.getDate();if(!confirm(`${c.getFullYear()}年${c.getMonth()+1}月のシフトを提出しますか？`))return;
 const b=document.getElementById("submitMonthButton");b.disabled=true;
 try{const r=await callApi({action:"submitMonthlyShift",idToken:currentIdToken,year:c.getFullYear(),month:c.getMonth()+1});if(!r.success)throw new Error(r.error||"提出に失敗しました");showNotice("シフトを提出しました");await loadDisplayedMonth()}catch(e){showNotice(e.message||String(e))}finally{b.disabled=false}
}
function openBulkModal(){resetBulkForm();updateBulkTargetMonthText();selectBulkMode("selectedDates");document.getElementById("bulkModal").classList.remove("hidden");document.body.classList.add("modal-open")}
function closeBulkModal(){if(isBulkSaving)return;document.getElementById("bulkModal").classList.add("hidden");document.body.classList.remove("modal-open")}
function resetBulkForm(){bulkMode="selectedDates";bulkStatus="working";bulkWeekdays=[];document.querySelectorAll(".weekday-button").forEach(b=>b.classList.remove("selected"));selectBulkStatus("working");setTime("bulkStart",currentCastDefaults.defaultStartTime);setTime("bulkEnd",currentCastDefaults.defaultEndTime);setBulkEndTimeLastState(false);document.getElementById("bulkNote").value="";document.getElementById("bulkOverwrite").checked=false;updateMultiSelectDisplay();updateBulkPreview()}
function selectBulkMode(m){bulkMode=m;document.getElementById("bulkModeSelectedDates").classList.toggle("selected",m==="selectedDates");document.getElementById("bulkModeWeekdays").classList.toggle("selected",m==="weekdays");document.getElementById("selectedDatesModePanel").classList.toggle("hidden",m!=="selectedDates");document.getElementById("weekdaysModePanel").classList.toggle("hidden",m!=="weekdays");updateBulkPreview()}
function selectBulkStatus(s){bulkStatus=s;["working","holiday","undecided"].forEach(x=>document.getElementById("bulkStatus"+cap(x)).classList.toggle("selected",x===s));document.getElementById("bulkWorkingFields").classList.toggle("hidden",s!=="working")}
function startMultiSelect(){closeBulkModal();isMultiSelectMode=true;multiSelectedDates=[];document.body.classList.add("multi-select-mode");document.getElementById("multiSelectBar").classList.remove("hidden");updateMultiSelectDisplay();refreshMultiSelectedDays();showNotice("入力したい日を選択してください")}
function cancelMultiSelect(){isMultiSelectMode=false;multiSelectedDates=[];document.getElementById("multiSelectBar").classList.add("hidden");refreshMultiSelectedDays();updateMultiSelectDisplay()}
function toggleMultiSelectedDate(d){const i=multiSelectedDates.indexOf(d);if(i>=0)multiSelectedDates.splice(i,1);else multiSelectedDates.push(d);multiSelectedDates.sort();refreshMultiSelectedDays();updateMultiSelectDisplay()}
function openSelectedDatesInput(){if(!multiSelectedDates.length)return;isMultiSelectMode=false;document.getElementById("multiSelectBar").classList.add("hidden");refreshMultiSelectedDays();resetBulkForm();bulkMode="selectedDates";selectBulkMode("selectedDates");updateBulkPreview();document.getElementById("bulkModal").classList.remove("hidden");document.body.classList.add("modal-open")}
function refreshMultiSelectedDays(){document.querySelectorAll(".fc-daygrid-day").forEach(el=>applyMultiSelectClass(el,el.getAttribute("data-date")))}
function applyMultiSelectClass(el,d){if(el&&d)el.classList.toggle("multi-selected-day",multiSelectedDates.includes(d))}
function updateMultiSelectDisplay(){const n=multiSelectedDates.length;document.getElementById("multiSelectCount").textContent=n+"日選択";document.getElementById("selectedDatesSummaryCount").textContent=n+"日";document.getElementById("selectedDatesSummary").classList.toggle("hidden",n===0);document.getElementById("multiSelectNextButton").disabled=n===0}
function toggleBulkWeekday(n){const i=bulkWeekdays.indexOf(n);if(i>=0)bulkWeekdays.splice(i,1);else bulkWeekdays.push(n);bulkWeekdays.sort();document.getElementById("bulkWeekday"+n).classList.toggle("selected",bulkWeekdays.includes(n));updateBulkPreview()}
function getWeekdayTargetDates(){if(!calendar)return[];const c=calendar.getDate(),y=c.getFullYear(),m=c.getMonth(),last=new Date(y,m+1,0).getDate(),a=[];for(let d=1;d<=last;d++){const x=new Date(y,m,d);if(bulkWeekdays.includes(x.getDay()))a.push(formatDateObject(x))}return a}
function updateBulkPreview(){const n=bulkMode==="selectedDates"?multiSelectedDates.length:getWeekdayTargetDates().length;document.getElementById("bulkPreviewCount").textContent=n+"日"}
function updateBulkTargetMonthText(){if(!calendar)return;const c=calendar.getDate();document.getElementById("bulkTargetMonthText").textContent=`${c.getFullYear()}年${c.getMonth()+1}月へまとめて入力します`}
async function saveBulkShifts(){
 if(isBulkSaving)return;const dates=bulkMode==="selectedDates"?multiSelectedDates:getWeekdayTargetDates();if(!dates.length){showNotice(bulkMode==="weekdays"?"曜日を選択してください":"日付を選択してください");return}
 let startTime="",endTime="";if(bulkStatus==="working"){startTime=getTime("bulkStart");endTime=isBulkEndTimeLast?"LAST":getTime("bulkEnd");if(!startTime||!endTime){showNotice("出勤時間と退勤時間を入力してください");return}}
 isBulkSaving=true;const b=document.getElementById("bulkSaveButton");b.disabled=true;b.textContent="保存中...";
 try{
  let r;
  if(bulkMode==="selectedDates"){
   r=await callApi({action:"saveMultiShifts",idToken:currentIdToken,dates:JSON.stringify(multiSelectedDates),status:bulkStatus,startTime,endTime,note:document.getElementById("bulkNote").value,overwrite:document.getElementById("bulkOverwrite").checked});
  }else{
   const c=calendar.getDate();r=await callApi({action:"saveBulkShifts",idToken:currentIdToken,targetMonth:`${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,"0")}`,weekdays:JSON.stringify(bulkWeekdays),status:bulkStatus,start:startTime,end:endTime,transport:false,note:document.getElementById("bulkNote").value,overwrite:document.getElementById("bulkOverwrite").checked});
  }
  if(!r.success)throw new Error(r.error||"一括保存に失敗しました");closeBulkModalForce();multiSelectedDates=[];showNotice(`${r.savedCount??dates.length}日保存しました`);await loadDisplayedMonth()
 }catch(e){showNotice(e.message||String(e))}finally{isBulkSaving=false;b.disabled=false;b.textContent="まとめて保存"}
}
function closeBulkModalForce(){document.getElementById("bulkModal").classList.add("hidden");document.body.classList.remove("modal-open")}
function initializeManualInputs(){["start","end","bulkStart","bulkEnd"].forEach(p=>{const h=document.getElementById(p+"Hour"),m=document.getElementById(p+"Minute");h.addEventListener("input",()=>{digits(h);if(h.value.length===2)m.focus()});m.addEventListener("input",()=>digits(m));h.addEventListener("blur",()=>padPart(h,23));m.addEventListener("blur",()=>padPart(m,59))})}
function digits(el){el.value=el.value.replace(/\D/g,"").slice(0,2)}
function padPart(el,max){if(el.value==="")return;let n=Number(el.value);if(n>max)n=max;el.value=String(n).padStart(2,"0")}
function setTime(prefix,t){if(t==="LAST")return;const [h,m]=normalizeTime(t,prefix.toLowerCase().includes("end")?"01:00":"20:00").split(":");document.getElementById(prefix+"Hour").value=h;document.getElementById(prefix+"Minute").value=m}
function getTime(prefix){const h=document.getElementById(prefix+"Hour"),m=document.getElementById(prefix+"Minute");padPart(h,23);padPart(m,59);if(!h.value||!m.value)return"";return h.value+":"+m.value}
function toggleEndTimeLast(){setEndTimeLastState(!isEndTimeLast)}
function setEndTimeLastState(v){isEndTimeLast=!!v;const f=document.getElementById("endTimeField"),b=document.getElementById("endTimeLastButton");document.getElementById("endHour").disabled=isEndTimeLast;document.getElementById("endMinute").disabled=isEndTimeLast;f.classList.toggle("last-selected",isEndTimeLast);b.classList.toggle("selected",isEndTimeLast);b.textContent=isEndTimeLast?"LASTを解除する":"退勤時間をLASTにする"}
function toggleBulkEndTimeLast(){setBulkEndTimeLastState(!isBulkEndTimeLast)}
function setBulkEndTimeLastState(v){isBulkEndTimeLast=!!v;const f=document.getElementById("bulkEndTimeField"),b=document.getElementById("bulkEndTimeLastButton");document.getElementById("bulkEndHour").disabled=isBulkEndTimeLast;document.getElementById("bulkEndMinute").disabled=isBulkEndTimeLast;f.classList.toggle("last-selected",isBulkEndTimeLast);b.classList.toggle("selected",isBulkEndTimeLast);b.textContent=isBulkEndTimeLast?"LASTを解除する":"退勤時間をLASTにする"}
function normalizeTime(v,f){const s=String(v||"").trim();return /^\d{2}:\d{2}$/.test(s)?s:f}
function parseLocalDate(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function formatDateObject(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function showNotice(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3000)}
function hideLoading(){document.getElementById("loadingScreen").classList.add("hide")}
function showAuthLoading(msg){document.getElementById("authApp").innerHTML=`<div class="loading"><div class="spinner"></div>${escapeHtml(msg)}</div>`}
function showError(msg){document.getElementById("authView").classList.remove("hidden");document.getElementById("shiftView").classList.add("hidden");document.getElementById("authApp").innerHTML=`<div class="status-icon error">!</div><h1>エラー</h1><div class="description">ROYAL SHIFTを開けませんでした</div><div class="error-message">${escapeHtml(msg)}</div>`}
function showRegistrationForm(){document.getElementById("authApp").innerHTML=`<div class="status-icon">✓</div><h1>LINE認証成功</h1><div class="description">初回登録を行います。<br>CASTに登録されている名前を入力してください。</div><div class="form-group"><label>キャスト名</label><input id="castName" placeholder="例：えま" autocomplete="off"></div><button id="submitButton" class="primary-button" onclick="submitRegistration()">登録申請する</button><div id="formError" class="error-message hidden"></div>`}
async function submitRegistration(){const input=document.getElementById("castName"),b=document.getElementById("submitButton"),er=document.getElementById("formError"),name=input.value.trim();if(!name){er.textContent="お名前を入力してください";er.classList.remove("hidden");return}b.disabled=true;b.textContent="申請中...";try{const r=await callApi({action:"submitRegistrationRequest",idToken:currentIdToken,castName:name});if(!r.success)throw new Error(r.error||"登録申請に失敗しました");if(r.alreadyRegistered){await checkAuthStatus();return}showPending({castName:r.castName||name})}catch(e){er.textContent=e.message||String(e);er.classList.remove("hidden");b.disabled=false;b.textContent="登録申請する"}}
function showPending(r){document.getElementById("authApp").innerHTML=`<div class="status-icon pending">⏳</div><h1>登録申請済み</h1><div class="description">登録申請を受け付けました。<br>管理者の承認をお待ちください。</div>${r&&r.castName?`<div class="user-name">${escapeHtml(r.castName)}</div>`:""}<div class="badge">承認待ち</div>`}
async function loadAdminRequests(){/* 管理者承認機能は認証ロジックを保持。管理画面を別導線にするまでは非表示。 */ try{await callApi({action:"getRegistrationRequests",idToken:currentIdToken})}catch(e){console.warn(e)}}
async function approveRequest(id){const r=await callApi({action:"approveRegistrationRequest",idToken:currentIdToken,requestId:id});if(!r.success)throw new Error(r.error)}
async function rejectRequest(id){const r=await callApi({action:"rejectRegistrationRequest",idToken:currentIdToken,requestId:id,note:""});if(!r.success)throw new Error(r.error)}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
</script>
</body>
</html>
