<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ROYAL SHIFT</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        #f4f5f7;

      color:
        #222;
    }


    .container {
      width: 100%;
      max-width: 480px;

      margin: 0 auto;

      padding:
        24px 16px 60px;
    }


    .logo {
      text-align: center;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: 2px;

      margin:
        12px 0 6px;
    }


    .sub-title {
      text-align: center;

      color: #777;

      font-size: 13px;

      margin-bottom: 28px;
    }


    .card {
      background: #fff;

      border-radius: 18px;

      padding: 24px 20px;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, 0.06);

      margin-bottom: 16px;
    }


    .status-icon {
      width: 64px;
      height: 64px;

      margin:
        0 auto 18px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 30px;
    }


    .status-icon.success {
      background: #e9f8ee;
    }


    .status-icon.pending {
      background: #fff4d8;
    }


    .status-icon.error {
      background: #ffe8e8;
    }


    h1 {
      margin:
        0 0 10px;

      text-align: center;

      font-size: 22px;
    }


    .description {
      margin:
        0 0 24px;

      text-align: center;

      font-size: 14px;

      line-height: 1.7;

      color: #666;
    }


    .user-name {
      text-align: center;

      font-size: 26px;
      font-weight: 700;

      margin-bottom: 8px;
    }


    .cast-id {
      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 16px;
    }


    .badge {
      display: table;

      margin: 0 auto;

      padding:
        6px 14px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 700;

      background: #222;
      color: #fff;
    }


    .form-group {
      margin-top: 20px;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;
    }


    input {
      width: 100%;

      height: 52px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding:
        0 14px;

      font-size: 16px;

      outline: none;

      background: #fff;
    }


    input:focus {
      border-color: #222;
    }


    button {
      width: 100%;

      height: 54px;

      margin-top: 18px;

      border: none;

      border-radius: 12px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      background: #222;
      color: #fff;
    }


    button:disabled {
      opacity: 0.5;

      cursor: default;
    }


    .loading {
      text-align: center;

      padding:
        50px 20px;

      color: #666;
    }


    .spinner {
      width: 38px;
      height: 38px;

      margin:
        0 auto 18px;

      border:
        4px solid #ddd;

      border-top-color: #222;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    .error-message {
      margin-top: 14px;

      padding: 12px;

      border-radius: 10px;

      background: #fff0f0;

      color: #c62828;

      font-size: 13px;

      line-height: 1.6;
    }


    .line-name {
      margin-top: 20px;

      padding-top: 18px;

      border-top:
        1px solid #eee;

      text-align: center;

      font-size: 12px;

      color: #999;
    }


    .hidden {
      display: none;
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="logo">
      ROYAL SHIFT
    </div>

    <div class="sub-title">
      ROYAL STAFF SYSTEM
    </div>


    <div
      id="app"
      class="card"
    >

      <div class="loading">

        <div class="spinner"></div>

        LINE認証中...

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
     * 01. 設定
     * ===================================================== */

    const LIFF_ID =
      "2011488723-gI54Hlt3";


    const GAS_API_URL =
      "https://script.google.com/macros/s/AKfycbwSZZNbraag8jTLbZbqoXbq9UDQfCeIwA404xkEcVP9l5UZ-7-cCdQCNVXKVq7wqo8pNg/exec";


    let currentIdToken =
      "";


    let currentLineDisplayName =
      "";


    /* =====================================================
     * 02. 起動
     * ===================================================== */

    window.addEventListener(
      "load",
      initializeApp
    );


    async function initializeApp() {

      try {

        await liff.init({
          liffId:
            LIFF_ID
        });


        if (
          !liff.isLoggedIn()
        ) {

          liff.login();

          return;

        }


        currentIdToken =
          liff.getIDToken();


        if (
          !currentIdToken
        ) {

          throw new Error(
            "LINE認証情報を取得できませんでした"
          );

        }


        await checkAuthStatus();


      } catch (error) {

        showError(
          error.message ||
          String(error)
        );

      }

    }


    /* =====================================================
     * 03. 認証状態確認
     * ===================================================== */

    async function checkAuthStatus() {

      showLoading(
        "登録情報を確認しています..."
      );


      const result =
        await callApi({

          action:
            "authStatus",

          idToken:
            currentIdToken

        });


      if (
        !result.success
      ) {

        throw new Error(
          result.error ||
          "認証状態を確認できませんでした"
        );

      }


      /*
       * 登録済み
       */
      if (
        result.registered
      ) {

        showRegistered(
          result.cast
        );

        return;

      }


      currentLineDisplayName =
        result.lineDisplayName || "";


      /*
       * 承認待ち
       */
      if (
        result.pending
      ) {

        showPending(
          result.pendingRequest
        );

        return;

      }


      /*
       * 未登録
       */
      showRegistrationForm();

    }


    /* =====================================================
     * 04. 登録申請
     * ===================================================== */

    async function submitRegistration() {

      const input =
        document.getElementById(
          "castName"
        );


      const button =
        document.getElementById(
          "submitButton"
        );


      const errorArea =
        document.getElementById(
          "formError"
        );


      const castName =
        String(
          input.value || ""
        ).trim();


      errorArea.innerHTML =
        "";


      errorArea.classList.add(
        "hidden"
      );


      if (
        !castName
      ) {

        errorArea.textContent =
          "お名前を入力してください";


        errorArea.classList.remove(
          "hidden"
        );


        return;

      }


      button.disabled =
        true;


      button.textContent =
        "申請中...";


      try {

        const result =
          await callApi({

            action:
              "submitRegistrationRequest",

            idToken:
              currentIdToken,

            castName:
              castName

          });


        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            "登録申請に失敗しました"
          );

        }


        /*
         * すでに登録済みだった場合
         */
        if (
          result.alreadyRegistered
        ) {

          await checkAuthStatus();

          return;

        }


        /*
         * 申請成功
         */
        showPending({

          castName:
            result.castName ||
            castName,

          status:
            "承認待ち"

        });


      } catch (error) {

        button.disabled =
          false;


        button.textContent =
          "登録申請する";


        errorArea.textContent =
          error.message ||
          String(error);


        errorArea.classList.remove(
          "hidden"
        );

      }

    }


    /* =====================================================
     * 05. API通信
     * ===================================================== */

    async function callApi(
      data
    ) {

      const params =
        new URLSearchParams();


      Object.keys(
        data
      ).forEach(
        (key) => {

          params.append(
            key,
            data[key] == null
              ? ""
              : String(data[key])
          );

        }
      );


      const response =
        await fetch(
          GAS_API_URL,
          {
            method:
              "POST",

            body:
              params
          }
        );


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );

      } catch (error) {

        throw new Error(
          "サーバーから正しい応答を取得できませんでした"
        );

      }

    }


    /* =====================================================
     * 06. 登録済み画面
     * ===================================================== */

    function showRegistered(
      cast
    ) {

      const adminBadge =
        cast.isAdmin

          ? `
            <div class="badge">
              管理者
            </div>
          `

          : `
            <div class="badge">
              登録済み
            </div>
          `;


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon success">
          ✓
        </div>

        <h1>
          LINE認証成功
        </h1>

        <div class="description">
          ROYAL SHIFTにログインしました
        </div>

        <div class="user-name">
          ${escapeHtml(
            cast.castName || ""
          )}
        </div>

        <div class="cast-id">
          CAST ID :
          ${escapeHtml(
            cast.castId || ""
          )}
        </div>

        ${adminBadge}

      `;

    }


    /* =====================================================
     * 07. 未登録画面
     * ===================================================== */

    function showRegistrationForm() {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon success">
          ✓
        </div>

        <h1>
          LINE認証成功
        </h1>

        <div class="description">
          初回登録を行います。<br>
          CASTに登録されている名前を入力してください。
        </div>


        <div class="form-group">

          <label for="castName">
            キャスト名
          </label>

          <input
            id="castName"
            type="text"
            placeholder="例：えま"
            autocomplete="off"
          >

        </div>


        <button
          id="submitButton"
          type="button"
          onclick="submitRegistration()"
        >
          登録申請する
        </button>


        <div
          id="formError"
          class="error-message hidden"
        ></div>


        ${
          currentLineDisplayName

            ? `
              <div class="line-name">
                LINE：
                ${escapeHtml(
                  currentLineDisplayName
                )}
              </div>
            `

            : ""
        }

      `;

    }


    /* =====================================================
     * 08. 承認待ち画面
     * ===================================================== */

    function showPending(
      request
    ) {

      const castName =
        request &&
        request.castName

          ? request.castName

          : "";


      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon pending">
          ⏳
        </div>

        <h1>
          登録申請済み
        </h1>

        <div class="description">
          登録申請を受け付けました。<br>
          管理者の承認をお待ちください。
        </div>


        ${
          castName

            ? `
              <div class="user-name">
                ${escapeHtml(
                  castName
                )}
              </div>
            `

            : ""
        }


        <div class="badge">
          承認待ち
        </div>

      `;

    }


    /* =====================================================
     * 09. ローディング
     * ===================================================== */

    function showLoading(
      message
    ) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="loading">

          <div class="spinner"></div>

          ${escapeHtml(
            message || "読み込み中..."
          )}

        </div>

      `;

    }


    /* =====================================================
     * 10. エラー
     * ===================================================== */

    function showError(
      message
    ) {

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="status-icon error">
          !
        </div>

        <h1>
          エラー
        </h1>

        <div class="description">
          ROYAL SHIFTを開けませんでした
        </div>

        <div class="error-message">
          ${escapeHtml(
            message ||
            "不明なエラーが発生しました"
          )}
        </div>

      `;

    }


    /* =====================================================
     * 11. HTMLエスケープ
     * ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
</html>
